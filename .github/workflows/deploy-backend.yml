# main에 backend 변경이 머지되면 Cloud Run에 백엔드를 배포한다.
# GCP 인증은 Workload Identity Federation(키 파일 없음). 1회 설정: .github/setup-gcp-deploy.sh
# DB 마이그레이션(backend/migrations)은 자동 적용하지 않는다 — 머지 전에 Supabase에 먼저 적용한다.
name: Deploy backend (Cloud Run)

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

# 배포가 겹치면 뒤 배포를 기다리게 한다 (진행 중인 배포는 취소하지 않음)
concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write  # Workload Identity Federation OIDC 토큰 발급

env:
  PROJECT_ID: fin-aily-us
  REGION: asia-northeast1
  SERVICE: fin-aily-us

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Syntax check
        run: python -m compileall -q backend/app

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      # 기존 서비스 설정(환경변수·minScale·cpu-throttling 등)은 그대로 이어진다.
      - name: Deploy
        run: |
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" \
            --source backend --quiet

      - name: Smoke test
        run: |
          URL=$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')
          curl -fsS --retry 3 --retry-delay 5 "$URL/health"
